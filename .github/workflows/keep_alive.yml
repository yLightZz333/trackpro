name: Keep TrackPro Server Awake

on:
  schedule:
    # Dispara a cada 5 minutos com User-Agent real de navegador para evitar sleep do Render
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Check
        run: |
          curl -s -f -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" -m 25 "https://meutrackpro.onrender.com/api/health" || echo "Servidor pingado"
