name: Keep TrackPro Server Awake

on:
  schedule:
    # Dispara a cada 10 minutos para evitar que o Render entre em modo de espera (Cold Start)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Check
        run: |
          curl -s -f -m 25 "https://meutrackpro.onrender.com/api/health" || echo "Servidor pingado"
